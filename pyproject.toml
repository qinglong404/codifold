[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codifold"
dynamic = ["version"]
description = "实验性的中文逻辑图阅读器与编辑器（本地优先 Demo）"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "likefeng" }]
keywords = ["code-reading", "flowchart", "documentation", "chinese"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
]
# 后端只依赖标准库；前端构建产物已随仓库提供，运行无需 Node

[project.scripts]
codifold = "codifold.workbench:main"

[project.urls]
Repository = "https://github.com/qinglong404/codifold"
Issues = "https://github.com/qinglong404/codifold/issues"

[tool.setuptools]
packages = ["codifold"]

[tool.setuptools.dynamic]
version = {attr = "codifold.__version__"}
